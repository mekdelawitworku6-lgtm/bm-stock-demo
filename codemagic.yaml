workflows:
  android:
    name: Android AAB
    max_build_duration: 30
    working_directory: apps/bm-stock-flutter-app
    environment:
      flutter: stable
      vars:
        BASE_URL: "https://bmstock.possibletechplc.com/api/v1"
    scripts:
      - name: Fix Android SDK
        script: |
          if [ -d "/usr/local/share/android-sdk/platforms/android-37.0" ] && [ ! -e "/usr/local/share/android-sdk/platforms/android-37" ]; then
            ln -s android-37.0 /usr/local/share/android-sdk/platforms/android-37
          fi
      - name: Get dependencies
        script: flutter pub get
      - name: Build release AAB and APK
        script: |
          flutter build appbundle --release --dart-define=BASE_URL="$BASE_URL"
          flutter build apk --release --dart-define=BASE_URL="$BASE_URL"
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/bm-stock-flutter-app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bmstock
      vars:
        BASE_URL: "https://bmstock.possibletechplc.com/api/v1"
    integrations:
      app_store_connect: bm_stock_asc
    scripts:
      - name: Get dependencies
        script: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-number=$(($BUILD_NUMBER + 1)) \
            --dart-define=BASE_URL="$BASE_URL" \
            --export-options-plist="$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
