services:
  - type: web
    name: bm-stock-demo
    runtime: node
    plan: free
    rootDir: apps/bm-stock-frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
