#      - ./nginx.conf:/etc/nginx/nginx.conf:ro
#    depends_on:
#      - app
#    networks:
#      - nestjs-network
#    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  nestjs-network:
    external: true
    name: inventory-backend_nestjs-network